[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sofia-lorawan-mesh-sim"
version = "0.1.0"
description = "Sofia LoRaWAN mesh simulation with MILP relay optimization"
requires-python = ">=3.12"
dependencies = [
  "PyQt6==6.11.0",
  "pyqtgraph==0.14.0",
  "pyqtgraph-gis==0.0.9",
  "numpy==2.4.4",
  "scipy==1.17.1",
  "PuLP==3.3.0",
  "requests==2.33.1",
  "amqtt==0.11.3",
  "matplotlib==3.10.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
